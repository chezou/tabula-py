name: Python testing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Lint
      run: uvx nox -s lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        java-package: jdk
        distribution: temurin
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Test
      run: uvx nox -s tests-${{ matrix.python }}
    - name: Test with jpype
      # Keep in sync with JPYPE_PYTHON_VERSION in noxfile.py
      if: matrix.python == '3.14'
      run: uvx nox -s tests_jpype
