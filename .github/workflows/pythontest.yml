name: Python testing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install nox
      run: python -m pip install nox
    - name: Lint
      run: nox -s lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        java-package: jdk
        distribution: temurin
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install nox
      run: python -m pip install nox
    - name: Test
      run: nox -s tests-${{ matrix.python }}

  tests-jpype:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        java-package: jdk
        distribution: temurin
    - uses: actions/setup-python@v7
      with:
        # Keep in sync with JPYPE_PYTHON_VERSION in noxfile.py
        python-version: '3.14'
    - name: Install nox
      run: python -m pip install nox
    - name: Test with jpype
      run: nox -s tests_jpype
