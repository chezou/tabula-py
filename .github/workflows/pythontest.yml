name: Python testing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        java-package: jdk
        distribution: temurin
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: |
          3.11
          3.12
          3.13
          3.14
          3.15
    - name: Install dependencies and test
      run: |
        python -m pip install --upgrade pip
        pip install nox
        pip install .
        nox
